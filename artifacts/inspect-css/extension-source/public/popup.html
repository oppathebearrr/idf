<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Security Inspector</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f1e9;
        color: #173b50;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        background:
          linear-gradient(rgba(23, 59, 80, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 59, 80, 0.035) 1px, transparent 1px),
          #f4f1e9;
        background-size: 24px 24px;
      }

      main {
        padding: 18px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #9b7120;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .card {
        border: 1px solid rgba(23, 59, 80, 0.16);
        background: rgba(255, 255, 255, 0.64);
        box-shadow: 4px 4px 0 #c69c3d;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px;
      }

      .label {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
      }

      .switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex: 0 0 auto;
      }

      .switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .track {
        position: absolute;
        inset: 0;
        border: 1px solid #78909a;
        border-radius: 999px;
        background: #d6d8d1;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease;
      }

      .track::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fffdf8;
        box-shadow: 0 1px 2px rgba(23, 59, 80, 0.28);
        content: "";
        transition: transform 150ms ease;
      }

      .switch input:checked + .track {
        border-color: #1a6b72;
        background: #1a6b72;
      }

      .switch input:checked + .track::after {
        transform: translateX(18px);
      }

      .switch input:focus-visible + .track {
        outline: 2px solid #c69c3d;
        outline-offset: 2px;
      }

      .actions {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      button {
        min-height: 38px;
        border: 1px solid #173b50;
        border-radius: 0;
        background: #173b50;
        color: #fffdf8;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      button:hover {
        filter: brightness(1.08);
      }

      button:focus-visible {
        outline: 2px solid #c69c3d;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Local-first browser tooling</p>
      <h1>Security Inspector</h1>

      <section class="card" aria-label="Security Inspector">
        <div class="row">
          <div>
            <p class="label">Security Inspector</p>
          </div>
          <label class="switch" aria-label="Turn Security Inspector on or off">
            <input id="global-toggle" type="checkbox" />
            <span class="track"></span>
          </label>
        </div>
      </section>

      <div class="actions">
        <button id="open-inspector" type="button">Activate inspector</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
