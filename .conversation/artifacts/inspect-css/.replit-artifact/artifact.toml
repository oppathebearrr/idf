kind = "web"
previewPath = "/"
title = "Inspect CSS"
description = "A hosted download page for the Inspect CSS browser extension, with the production extension package built from the original repository."
version = "1.0.0"
id = "artifacts/inspect-css"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25857

[services.development]
run = "pnpm --filter @workspace/inspect-css run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inspect-css", "run", "build" ]
serve = "static"
publicDir = "artifacts/inspect-css/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25857"
BASE_PATH = "/"
